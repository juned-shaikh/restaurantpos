<!-- Global In-App Toast Notifications -->
<app-toast></app-toast>

<ng-container *ngIf="!isAuthPage; else authLayout">
  <div class="app-layout">
    <app-sidebar></app-sidebar>
    <div class="main-container">
      <app-header></app-header>
      <main class="page-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</ng-container>

<ng-template #authLayout>
  <router-outlet></router-outlet>
</ng-template>

<!-- Anti-Theft / Fraud Prevention: Manager Security PIN Modal -->
<div class="modal-overlay" *ngIf="approvalRequest" (click)="cancelPinApproval()">
  <div class="modal-dialog security-pin-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header" style="background: #FFF1F2; border-bottom: 1px solid #FECDD3;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <i class="ri-shield-keyhole-fill" style="color: #881337; font-size: 22px;"></i>
        <div>
          <h3 style="color: #881337; margin: 0; font-size: 16px;">Manager Security Override</h3>
          <span style="font-size: 11px; color: #9F1239; font-weight: 600;">ANTI-THEFT FRAUD AUDIT ACTIVE</span>
        </div>
      </div>
      <button type="button" class="modal-close-btn" (click)="cancelPinApproval()" title="Cancel">
        <i class="ri-close-line"></i>
      </button>
    </div>

    <div class="modal-body" style="text-align: center; padding: 20px 24px;">
      <div style="font-size: 13px; font-weight: 700; color: #0F172A; margin-bottom: 4px;">
        {{ approvalRequest.action }}
      </div>
      <p style="font-size: 12px; color: #64748B; margin-bottom: 16px;">
        {{ approvalRequest.description }}
      </p>

      <!-- PIN Display Dots -->
      <div class="pin-display-strip">
        <span class="pin-dot" [class.filled]="enteredPin.length >= 1"></span>
        <span class="pin-dot" [class.filled]="enteredPin.length >= 2"></span>
        <span class="pin-dot" [class.filled]="enteredPin.length >= 3"></span>
        <span class="pin-dot" [class.filled]="enteredPin.length >= 4"></span>
      </div>

      <div *ngIf="pinError" class="pin-error-notice">
        {{ pinError }}
      </div>

      <!-- Touchscreen Number Pad (Standard Restaurant POS Numpad) -->
      <div class="pos-numpad-grid">
        <button type="button" class="numpad-btn" (click)="appendPin('1')">1</button>
        <button type="button" class="numpad-btn" (click)="appendPin('2')">2</button>
        <button type="button" class="numpad-btn" (click)="appendPin('3')">3</button>
        <button type="button" class="numpad-btn" (click)="appendPin('4')">4</button>
        <button type="button" class="numpad-btn" (click)="appendPin('5')">5</button>
        <button type="button" class="numpad-btn" (click)="appendPin('6')">6</button>
        <button type="button" class="numpad-btn" (click)="appendPin('7')">7</button>
        <button type="button" class="numpad-btn" (click)="appendPin('8')">8</button>
        <button type="button" class="numpad-btn" (click)="appendPin('9')">9</button>
        <button type="button" class="numpad-btn numpad-action" (click)="backspacePin()">⌫</button>
        <button type="button" class="numpad-btn" (click)="appendPin('0')">0</button>
        <button type="button" class="numpad-btn numpad-submit" (click)="submitPin()">OK</button>
      </div>

      <div style="font-size: 11px; color: #94A3B8; margin-top: 12px;">
        Authorized Manager PIN Required
      </div>
    </div>

    <div class="modal-footer" style="background: #F8FAFC;">
      <button type="button" class="btn btn-secondary" style="width: 100%;" (click)="cancelPinApproval()">Cancel Action</button>
    </div>
  </div>
</div>
