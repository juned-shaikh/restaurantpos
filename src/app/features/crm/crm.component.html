<div class="customers-page">
  <!-- Top Title Row -->
  <div class="customers-title-row">
    <div>
      <h1 class="page-title">Customers Directory</h1>
      <p class="page-subtitle">Customer contacts, visit frequency, and billing history</p>
    </div>

    <div class="header-right-actions">
      <button class="btn btn-primary" (click)="showCustomerModal = true">
        <i class="ri-user-add-line"></i> New customer
      </button>
    </div>
  </div>

  <!-- CUSTOMERS LIST -->
  <div class="customers-container">
    <!-- Search Bar -->
    <div class="search-box-row">
      <input
        type="search"
        placeholder="Search by name, phone, or email..."
        [(ngModel)]="searchQuery"
        class="customer-search-input"
      >
    </div>

    <!-- Customer Card Rows -->
    <div class="customer-cards-list">
      <div *ngFor="let c of filteredCustomers" class="customer-row-card card">
        <div class="c-info">
          <div class="c-name">{{ c.full_name }}</div>
          <div class="c-meta">{{ c.phone }} · {{ c.email || 'Phone verified guest' }}</div>
        </div>

        <div class="c-points">
          <span class="pts-badge"><i class="ri-shopping-bag-3-line" style="color: #16A34A; margin-right: 4px;"></i> {{ c.visit_count || 1 }} visits · ₹{{ (c.total_spent || 0) | number:'1.0-0' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New Customer Modal -->
<div class="modal-overlay" *ngIf="showCustomerModal" (click)="showCustomerModal = false">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>New Customer Profile</h3>
      <button type="button" class="modal-close-btn" (click)="showCustomerModal = false" title="Close">
        <i class="ri-close-line"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" [(ngModel)]="newCustName" placeholder="e.g. Priya Sharma" class="form-control" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Mobile Phone (for Loyalty SMS & WhatsApp) *</label>
        <input type="tel" [(ngModel)]="newCustPhone" placeholder="+91 98765 43210" class="form-control">
      </div>

      <div class="form-group">
        <label class="form-label">Email (Optional)</label>
        <input type="email" [(ngModel)]="newCustEmail" placeholder="priya@example.com" class="form-control">
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="showCustomerModal = false">Cancel</button>
      <button class="btn btn-primary" (click)="saveCustomer()">Save Profile</button>
    </div>
  </div>
</div>
