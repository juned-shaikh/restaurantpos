<div class="login-wrapper">
  <!-- Centered Responsive Container -->
  <div class="login-container">
    
    <!-- Top Branding Block -->
    <div class="brand-header">
      <div class="brand-avatar">
        <i class="ri-restaurant-2-line"></i>
      </div>
      <div>
        <h1 class="brand-title">CloudPOS Hospitality</h1>
        <p class="brand-subtitle">Sign in to your restaurant account</p>
      </div>
    </div>

    <!-- Clean Email & Password Login Pane -->
    <div class="login-form-pane">
      <div *ngIf="errorMessage" class="error-banner">
        <i class="ri-alert-line" style="margin-right: 6px;"></i> {{ errorMessage }}
      </div>

      <div class="form-group">
        <label class="form-label">Registered Email or Mobile Number</label>
        <div class="input-with-icon">
          <i class="ri-mail-line field-icon"></i>
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="e.g. name@restaurant.com or mobile"
            class="form-control"
            (keyup.enter)="submitPasswordLogin()"
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <div class="input-with-icon">
          <i class="ri-lock-line field-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Enter security password"
            class="form-control"
            (keyup.enter)="submitPasswordLogin()"
          >
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="showPassword = !showPassword"
            title="Toggle visibility"
          >
            <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <label class="remember-label">
          <input type="checkbox" [(ngModel)]="rememberMe">
          <span>Remember this POS terminal</span>
        </label>
      </div>

      <button
        class="btn-submit-login"
        [disabled]="isLoading"
        (click)="submitPasswordLogin()"
      >
        <span *ngIf="!isLoading">Sign In <i class="ri-arrow-right-line" style="margin-left: 6px;"></i></span>
        <span *ngIf="isLoading">Verifying & Signing In...</span>
      </button>
    </div>

    <!-- Footer Copyright -->
    <div class="login-footer">
      <span>CloudPOS Hospitality v2.4</span>
      <span>•</span>
      <span>Secure Cloud POS System</span>
    </div>

  </div>
</div>
